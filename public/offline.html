<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />
    <meta name="theme-color" content="#121316" />
    <title>Wink</title>
    <script>
      // sw.js adds the tap time to the url; it must not outlive this load in the address or a reload.
      try {
        const url = new URL(location.href);
        if (url.searchParams.has("t0")) {
          url.searchParams.delete("t0");
          history.replaceState(history.state, "", url.pathname + url.search + url.hash);
        }
      } catch {}
      // sw.js finds this page by its app url and posts a tapped notification's chat to it like to the app.
      if (navigator.serviceWorker) navigator.serviceWorker.onmessage = (event) => {
        if (event.data?.type !== "orbit-open" || typeof event.data.url !== "string") return;
        const next = new URL(event.data.url, location.href);
        if (typeof event.data.t0 === "number") next.searchParams.set("t0", String(event.data.t0));
        location.assign(next.href);
      };
    </script>
    <style>
      :root {
        color-scheme: dark;
        --app: #121316;
        --ink: #eeeff3;
        --ink-secondary: #a3a7b3;
        --accent: #929fff;
        --accent-ink: #121316;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--app);
        color: var(--ink);
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
        word-break: keep-all;
        overflow-wrap: anywhere;
      }
      main {
        display: grid;
        place-items: center;
        min-height: 100vh;
        min-height: 100dvh;
        padding: 24px 16px;
      }
      .panel {
        width: 100%;
        max-width: 360px;
        text-align: center;
      }
      svg {
        width: 56px;
        height: 56px;
      }
      h1 {
        margin: 16px 0 6px;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        color: var(--ink-secondary);
        font-size: 14px;
      }
      button {
        width: 100%;
        margin-top: 24px;
        padding: 12px;
        border: 0;
        border-radius: 12px;
        background: var(--accent);
        color: var(--accent-ink);
        font: inherit;
        font-weight: 600;
      }
      a {
        display: inline-block;
        margin-top: 16px;
        color: var(--ink-secondary);
        font-size: 13px;
      }
      a[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="panel" id="panel">
        <svg viewBox="0 0 256 256" aria-hidden="true">
          <rect x="12" y="12" width="232" height="232" rx="54" fill="#1f2747" />
          <path d="M72 86 L122 128 L72 170" fill="none" stroke="#ff4d9d" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
          <rect x="146" y="156" width="52" height="28" rx="14" fill="#ffd447" />
        </svg>
        <h1 id="title"></h1>
        <p id="detail" role="status" aria-live="polite"></p>
        <button id="retry" type="button"></button>
        <a id="pick" hidden></a>
      </div>
    </main>
    <script>
      // Shown by sw.js only when a page load could not reach this PC at all.
      // The relay's public status tells "PC asleep" from "relay down". When the
      // PC is online, the PC itself is asked: one that answers means the load
      // failed on the way (a phone waking onto its network), so the page loads
      // again; one that does not points at its certificate, which only the
      // browser can show.
      (() => {
        const RETRY_KEY = "wink-offline-retry";
        const RETRY_GAP_MS = 60_000;
        const COPY = {
          en: {
            title: "Cannot reach this PC",
            phoneOffline: "This phone is offline. Wink reconnects when it is back online.",
            relayDown: "Cannot reach the Wink relay. Trying again every 10 seconds.",
            asleep: "Your PC is asleep or Wink is closed.",
            asleepSince: "Your PC is asleep or Wink is closed (since {time}).",
            online: "Your PC is online, but this page did not load. If this keeps happening, open Wink on the PC and check Phone access; its security certificate may need attention.",
            retry: "Try again",
            pick: "Choose another PC",
          },
          ko: {
            title: "이 PC에 연결할 수 없습니다",
            phoneOffline: "휴대폰이 오프라인입니다. 다시 온라인이 되면 Wink가 연결됩니다.",
            relayDown: "Wink 릴레이에 연결할 수 없습니다. 10초마다 다시 시도합니다.",
            asleep: "PC가 절전 상태이거나 Wink가 닫혀 있습니다.",
            asleepSince: "PC가 절전 상태이거나 Wink가 닫혀 있습니다 ({time}부터).",
            online: "PC는 켜져 있지만 이 페이지를 불러오지 못했습니다. 계속되면 PC의 Wink에서 휴대폰 접속을 확인하세요. 보안 인증서에 문제가 있을 수 있습니다.",
            retry: "다시 시도",
            pick: "다른 PC 선택",
          },
        };
        let lang = "en";
        try {
          const saved = localStorage.getItem("omb-locale");
          const system = /^ko\b/i.test(navigator.language || "") ? "ko" : "en";
          lang = saved === "ko" ? "ko" : saved === "system" ? system : "en";
        } catch {}
        const t = (key, time) => COPY[lang][key].replace("{time}", time || "");
        // Held back until the first check, so a load that works on its second try never shows this page.
        const panel = document.getElementById("panel");
        panel.hidden = true;
        const show = () => (panel.hidden = false);
        setTimeout(show, 1000);
        document.documentElement.lang = lang;
        document.getElementById("title").textContent = t("title");
        const detail = document.getElementById("detail");
        const retry = document.getElementById("retry");
        retry.textContent = t("retry");
        retry.addEventListener("click", () => location.reload());

        const dot = location.hostname.indexOf(".");
        const label = location.hostname.slice(0, dot);
        const base = location.hostname.slice(dot + 1);
        const pick = document.getElementById("pick");
        pick.textContent = t("pick");
        pick.href = `https://${base}/?pick=1`;
        pick.hidden = false;
        const statusUrl = `https://relay.${base}/v1/status/${label}`;
        let down = false;

        // Any answer from this PC, even an error page, means its address and certificate work now.
        async function pcAnswers() {
          try {
            await fetch("/manifest.json", { cache: "no-store" });
            return true;
          } catch {
            return false;
          }
        }

        // Loads the page again unless this tab already did in the last minute, so a lasting fault cannot loop.
        function loadAgain() {
          try {
            const last = Number(sessionStorage.getItem(RETRY_KEY));
            if (Date.now() - last < RETRY_GAP_MS) return false;
            sessionStorage.setItem(RETRY_KEY, String(Date.now()));
          } catch {
            return false;
          }
          location.reload();
          return true;
        }

        async function message() {
          if (!navigator.onLine) {
            down = true;
            return t("phoneOffline");
          }
          let status;
          try {
            const res = await fetch(statusUrl, { cache: "no-store", credentials: "omit" });
            status = await res.json();
          } catch {
            down = true;
            return t("relayDown");
          }
          if (status.online) {
            // Came back while we watched: try the page again once.
            if (down) {
              location.reload();
              return null;
            }
            // Set first, so a probe that stalls past the panel's hold still shows the hint.
            detail.textContent = t("online");
            if ((await pcAnswers()) && loadAgain()) return null;
            return t("online");
          }
          down = true;
          const since = typeof status.since === "number" ? new Date(status.since).toLocaleTimeString(lang, { hour: "2-digit", minute: "2-digit" }) : "";
          return since ? t("asleepSince", since) : t("asleep");
        }

        async function check() {
          const text = await message();
          if (text === null) return;
          detail.textContent = text;
          show();
        }

        void check();
        setInterval(check, 10_000);
        window.addEventListener("online", check);
      })();
    </script>
  </body>
</html>
