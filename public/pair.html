<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />
    <meta name="theme-color" content="#121316" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/svg+xml" href="/app-icon.svg?v=2" />
    <link rel="manifest" href="/manifest.json" />
    <title>Wink</title>
    <style>
      :root {
        color-scheme: dark;
        --app: #121316;
        --inset: #0f1013;
        --hairline: #353944;
        --ink: #eeeff3;
        --ink-secondary: #a3a7b3;
        --accent: #929fff;
        --accent-ink: #121316;
        --danger: #ff8c98;
        --success: #7bd8a6;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--app);
        color: var(--ink);
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
        word-break: keep-all;
        overflow-wrap: anywhere;
      }
      main {
        display: grid;
        place-items: center;
        min-height: 100vh;
        min-height: 100dvh;
        padding: 24px 16px;
      }
      .panel {
        width: 100%;
        max-width: 360px;
        text-align: center;
      }
      img {
        width: 56px;
        height: 56px;
      }
      h1 {
        margin: 16px 0 6px;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        color: var(--ink-secondary);
        font-size: 14px;
      }
      form {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-top: 24px;
      }
      input {
        width: 100%;
        padding: 12px;
        border: 1px solid var(--hairline);
        border-radius: 12px;
        background: var(--inset);
        color: var(--ink);
        font: 600 24px/1.2 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        letter-spacing: 0.3em;
        text-align: center;
      }
      input:focus {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      button {
        padding: 12px;
        border: 0;
        border-radius: 12px;
        background: var(--accent);
        color: var(--accent-ink);
        font: inherit;
        font-weight: 600;
        transition: filter 150ms, transform 150ms;
      }
      button:active:not(:disabled) {
        transform: scale(0.99);
      }
      button:disabled {
        opacity: 0.5;
      }
      .google {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        border: 1px solid #8e918f;
        border-radius: 999px;
        background: #131314;
        color: #e3e3e3;
        font: 500 14px/20px Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", system-ui, sans-serif;
      }
      .status {
        min-height: 21px;
        margin-top: 12px;
        font-size: 13px;
      }
      .error {
        color: var(--danger);
      }
      .ok {
        color: var(--success);
      }
      .spinner {
        display: inline-block;
        width: 14px;
        height: 14px;
        margin-right: 8px;
        vertical-align: -1px;
        border: 2px solid currentColor;
        border-right-color: transparent;
        border-radius: 50%;
        animation: spin 800ms linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @font-face {
        font-family: "Geist";
        src: url(/fonts/Geist-Variable.woff2) format("woff2");
        font-weight: 100 900;
      }
      body.glasses,
      body.glasses main {
        display: block;
        place-items: normal;
        padding: 0;
        background: #000;
      }
      body.glasses .panel {
        display: none;
      }
      .glass {
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        color: #fff;
        font-family: "Geist", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .glass #g-ask,
      .glass #g-done {
        box-sizing: border-box;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 28px 34px 40px;
        text-align: center;
      }
      .g-icon {
        width: 64px;
        height: 64px;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(255, 77, 157, 0.2);
      }
      .glass h1 {
        margin: 22px 0 0;
        font-size: 28px;
        font-weight: 650;
        letter-spacing: -0.025em;
      }
      .glass p {
        margin: 10px 0 0;
        font-size: 18px;
        font-weight: 430;
        line-height: 1.4;
        color: #9aa2b4;
      }
      #g-text strong {
        color: #e2e6f2;
        font-weight: 580;
      }
      .g-code {
        position: relative;
        display: flex;
        gap: 22px;
        margin-top: 38px;
      }
      .g-group {
        display: flex;
        gap: 9px;
      }
      .g-group span {
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 66px;
        height: 82px;
        border-radius: 19px;
        border: 1.5px solid rgba(255, 255, 255, 0.2);
        background: linear-gradient(180deg, #191c25 0%, #12141b 100%);
        font-size: 36px;
        font-weight: 650;
        font-variant-numeric: tabular-nums;
      }
      .g-code:focus-within span.next {
        border: 2.5px solid #fff;
        box-shadow: 0 0 22px rgba(255, 255, 255, 0.16);
      }
      .g-code input {
        all: unset;
        position: absolute;
        inset: 0;
        color: transparent;
        caret-color: transparent;
      }
      #g-pair {
        width: 268px;
        height: 60px;
        margin-top: 38px;
        border: none;
        border-radius: 999px;
        background: #fff;
        color: #08090c;
        font: inherit;
        font-size: 20px;
        font-weight: 650;
        letter-spacing: -0.015em;
      }
      #g-pair:focus {
        outline: none;
        box-shadow: 0 0 26px rgba(255, 255, 255, 0.24);
      }
      .glass #g-pair[hidden] {
        display: block !important;
        visibility: hidden;
      }
      .glass #g-hint {
        margin-top: 24px;
        font-size: 15px;
        font-weight: 450;
        color: #777f92;
      }
      .g-ok {
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 104px;
        height: 104px;
        border: 3px solid #5be3a4;
        border-radius: 50%;
        color: #5be3a4;
        box-shadow: 0 0 30px rgba(91, 227, 164, 0.35);
      }
      #g-paired {
        margin-top: 26px;
        font-size: 28px;
        font-weight: 650;
        letter-spacing: -0.025em;
        color: #fff;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="panel">
        <img src="/app-icon.svg?v=2" alt="" />
        <h1 id="title"></h1>
        <p id="help" hidden></p>
        <form id="form" hidden>
          <button id="google" class="google" type="button" hidden>
            <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
              <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" />
              <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z" />
              <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z" />
              <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" />
            </svg>
            <span id="google-label"></span>
          </button>
          <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" spellcheck="false" />
          <button id="submit" type="submit"></button>
        </form>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </div>
      <section id="glass" class="glass" hidden>
        <div id="g-ask">
          <img class="g-icon" src="/app-icon.svg?v=2" alt="" />
          <h1 id="g-title"></h1>
          <p id="g-text"></p>
          <label class="g-code"><input id="g-code" type="text" autocomplete="off" spellcheck="false" /><span class="g-group"><span></span><span></span><span></span></span><span class="g-group"><span></span><span></span><span></span></span></label>
          <button id="g-pair" type="button" hidden></button>
          <p id="g-hint" role="status" aria-live="polite"></p>
        </div>
        <div id="g-done" hidden>
          <span class="g-ok"><svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7" /></svg></span>
          <p id="g-paired"></p>
          <p id="g-opening"></p>
        </div>
      </section>
    </main>
    <script>
      // Pairs this phone with one PC. The QR link carries a 2 minute token in the
      // fragment, which never reaches the server or a Referer; it is cleared before
      // anything else runs. The 6 digit code is the fallback for an installed app.
      // A Google sign-in comes back the same way, as #g=<ID token>.
      (() => {
        const COPY = {
          en: {
            title: "Pair this phone",
            opening: "Opening {name}…",
            help: "Enter the 6 digit code from Wink on your PC: Settings, Devices, Code instead of Google.",
            code: "6 digit code",
            submit: "Pair",
            pairing: "Pairing...",
            paired: "Paired. Opening Wink...",
            "wrong-credential": "That code is not right. Check the code on your PC.",
            "too-many-attempts": "Too many wrong codes. Get a new code on your PC: Settings, Devices, Code instead of Google.",
            "no-pairing": "That code expired or was already used. Get a new code on your PC: Settings, Devices, Code instead of Google.",
            "rate-limited": "Too many tries. Wait a minute and try again.",
            network: "Could not reach your PC. Check your connection and try again.",
            failed: "Pairing did not work. Get a new code on your PC: Settings, Devices, Code instead of Google.",
            google: "Continue with Google",
            "google-failed": "Google sign-in did not work. Try again, or enter the 6 digit code.",
            "wrong-account": "Use the Google account this PC is signed in with.",
            "google-not-ready": "Google sign-in isn't ready on this PC yet. Use the code.",
            android: "Android phone",
            phone: "Phone",
          },
          ko: {
            title: "이 휴대폰 연결",
            opening: "{name} 여는 중…",
            help: "PC의 Wink에서 설정 > 기기 > Google 대신 코드로 연결에 표시된 6자리 코드를 입력하세요.",
            code: "6자리 코드",
            submit: "연결",
            pairing: "연결하는 중...",
            paired: "연결되었습니다. Wink를 여는 중...",
            "wrong-credential": "코드가 맞지 않습니다. PC에 표시된 코드를 확인하세요.",
            "too-many-attempts": "잘못된 코드를 너무 많이 입력했습니다. PC의 설정 > 기기 > Google 대신 코드로 연결에서 새 코드를 받으세요.",
            "no-pairing": "코드가 만료되었거나 이미 사용되었습니다. PC의 설정 > 기기 > Google 대신 코드로 연결에서 새 코드를 받으세요.",
            "rate-limited": "시도가 너무 많습니다. 1분 뒤에 다시 시도하세요.",
            network: "PC에 연결할 수 없습니다. 네트워크를 확인하고 다시 시도하세요.",
            failed: "연결하지 못했습니다. PC의 설정 > 기기 > Google 대신 코드로 연결에서 새 코드를 받으세요.",
            google: "Google 계정으로 계속하기",
            "google-failed": "Google 로그인이 되지 않았습니다. 다시 시도하거나 6자리 코드를 입력하세요.",
            "wrong-account": "이 PC에 로그인된 Google 계정을 사용하세요.",
            "google-not-ready": "이 PC에서는 아직 Google 로그인을 사용할 수 없습니다. 코드를 사용하세요.",
            android: "Android 휴대폰",
            phone: "휴대폰",
          },
        };
        let lang = "en";
        try {
          const saved = localStorage.getItem("omb-locale");
          const system = /^ko\b/i.test(navigator.language || "") ? "ko" : "en";
          lang = saved === "ko" ? "ko" : saved === "system" ? system : "en";
        } catch {}
        const t = (key) => COPY[lang][key] || COPY.en[key] || COPY[lang].failed;
        const GLASS = {
          en: {
            title: "Pair with Wink",
            text: "Enter the 6-digit code from {pc}",
            pc: "your PC",
            hint: "Wink on PC › Settings › Devices",
            heard: "heard “{text}”",
            pair: "Connect",
            paired: "Paired",
            opening: "Opening Wink…",
          },
          ko: {
            title: "Wink와 연결",
            text: "{pc}에 표시된 6자리 코드를 입력하세요",
            pc: "PC",
            hint: "PC의 Wink › 설정 › 기기",
            heard: "들은 내용 “{text}”",
            pair: "연결",
            paired: "연결됨",
            opening: "Wink 여는 중…",
          },
        }[lang];
        // The glasses lens is a small square; the server's redirect to /pair carries no other sign.
        const glasses = window.matchMedia?.("(max-width: 800px) and (min-aspect-ratio: 4/5) and (max-aspect-ratio: 5/4)").matches === true;
        const spokenDigits = (text) => {
          const words = new Map(Object.entries({
            zero: "0", oh: "0", o: "0", one: "1", won: "1", two: "2", to: "2", too: "2", three: "3",
            four: "4", for: "4", five: "5", six: "6", seven: "7", eight: "8", ate: "8", nine: "9",
          }));
          return text
            .toLowerCase()
            .split(/[^a-z0-9]+/)
            .map((word) => (/^\d+$/.test(word) ? word : (words.get(word) ?? "")))
            .join("");
        };
        document.documentElement.lang = lang;

        const $ = (id) => document.getElementById(id);
        const help = $("help");
        const form = $("form");
        const input = $("code");
        const submit = $("submit");
        const status = $("status");
        const google = $("google");
        $("google-label").textContent = t("google");
        help.textContent = t("help");
        input.setAttribute("aria-label", t("code"));
        submit.textContent = t("submit");

        const query = new URLSearchParams(location.search);
        const goGoogle = query.get("g") === "1";
        const fragment = new URLSearchParams(location.hash.slice(1));
        const qrToken = fragment.get("k");
        const googleToken = fragment.get("g");
        const pcName = query.get("n") || fragment.get("n") || "Wink";
        if (location.hash) history.replaceState(null, "", location.pathname + location.search);

        // ?g=1 and a Google return finish on their own, so they show only which PC is opening.
        if (goGoogle || googleToken) {
          const spinner = document.createElement("span");
          spinner.className = "spinner";
          spinner.setAttribute("aria-hidden", "true");
          $("title").replaceChildren(spinner, t("opening").replace("{name}", () => pcName));
        } else {
          $("title").textContent = t("title");
        }

        const say = (text, tone) => {
          status.textContent = text;
          status.className = `status${tone ? ` ${tone}` : ""}`;
        };
        const randomId = () => {
          if (crypto.randomUUID) return crypto.randomUUID();
          return Array.from(crypto.getRandomValues(new Uint8Array(16)), (byte) => byte.toString(16).padStart(2, "0")).join("");
        };
        const phoneName = () => {
          const ua = navigator.userAgent;
          if (/iPhone/.test(ua)) return "iPhone";
          if (/iPad/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) return "iPad";
          if (/Android/.test(ua)) return t("android");
          if (/Windows/.test(ua)) return "Windows PC";
          if (/Macintosh/.test(ua)) return "Mac";
          return /Linux/.test(ua) ? "Linux PC" : t("phone");
        };
        const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

        async function finish() {
          // The worker shows an offline page when this PC can't be reached later.
          try {
            await navigator.serviceWorker.register("/sw.js");
            await Promise.race([navigator.serviceWorker.ready, wait(3000)]);
          } catch {}
          location.replace(glasses ? "/glasses" : "/");
        }

        async function pair(path, body) {
          for (let attempt = 0; ; attempt++) {
            try {
              const res = await fetch(path, {
                method: "POST",
                headers: { "content-type": "application/json" },
                credentials: "same-origin",
                cache: "no-store",
                body,
              });
              if (res.ok) return null;
              const answer = await res.json().catch(() => ({}));
              return typeof answer.error === "string" ? answer.error : "failed";
            } catch {
              if (attempt >= 2) return "network";
              await wait(1000 * (attempt + 1));
            }
          }
        }

        const startGoogle = () => location.assign("/api/phone/google/start");

        /** Whether this PC can take a Google sign-in; `go` says why not after ?g=1. */
        async function googleReady(go) {
          try {
            const res = await fetch("/api/phone/google/start", { method: "HEAD", credentials: "same-origin", cache: "no-store" });
            if (go && res.status === 409) say(t("google-not-ready"));
            return res.status === 204;
          } catch {
            return false;
          }
        }

        function showForm(ready = googleReady(false)) {
          $("title").textContent = t("title");
          help.hidden = false;
          form.hidden = false;
          submit.disabled = false;
          input.value = "";
          input.focus();
          void Promise.resolve(ready).then((yes) => {
            google.hidden = !yes;
          });
        }

        async function run(credential) {
          submit.disabled = true;
          say(t("pairing"));
          // One request id per attempt, so a retry after a lost answer gets the same phone.
          const error = await pair("/api/phone/pair", JSON.stringify({ credential, name: phoneName(), requestId: randomId() }));
          if (!error) {
            say(t("paired"), "ok");
            return finish();
          }
          say(t(error), "error");
          showForm();
        }

        async function runGoogle(credential) {
          const error = await pair("/api/phone/google", JSON.stringify({ credential, name: phoneName() }));
          if (!error) return finish();
          say(t(["wrong-account", "rate-limited", "network"].includes(error) ? error : "google-failed"), "error");
          if (glasses) showGlass();
          else showForm();
        }

        input.addEventListener("input", () => {
          input.value = input.value.replace(/\D/g, "").slice(0, 6);
        });
        form.addEventListener("submit", (event) => {
          event.preventDefault();
          if (/^\d{6}$/.test(input.value)) void run(input.value);
        });

        google.addEventListener("click", startGoogle);

        function showGlass() {
          const gCode = $("g-code");
          const gHint = $("g-hint");
          const gPair = $("g-pair");
          const cells = [...document.querySelectorAll(".g-group span")];
          const named = query.get("n") || fragment.get("n");
          document.body.classList.add("glasses");
          $("glass").hidden = false;
          $("g-title").textContent = GLASS.title;
          const pc = document.createElement("strong");
          pc.textContent = named || GLASS.pc;
          const [before, after] = GLASS.text.split("{pc}");
          $("g-text").replaceChildren(before, pc, after);
          gPair.textContent = GLASS.pair;
          $("g-paired").textContent = GLASS.paired;
          $("g-opening").textContent = GLASS.opening;
          const hint = (text, tone) => {
            gHint.textContent = text;
            gHint.className = tone || "";
          };
          const read = () => {
            const digits = spokenDigits(gCode.value).slice(0, 6);
            cells.forEach((cell, i) => {
              cell.textContent = digits[i] || "";
              cell.classList.toggle("next", i === digits.length);
            });
            const said = gCode.value.trim();
            if (/[a-z]/i.test(said)) hint(GLASS.heard.replace("{text}", () => said), "heard");
            else hint(GLASS.hint);
            gPair.hidden = digits.length !== 6;
            if (!gPair.hidden) gPair.focus();
            return digits;
          };
          gCode.addEventListener("input", read);
          gCode.addEventListener("change", read);
          gPair.addEventListener("click", async () => {
            const digits = read();
            if (digits.length !== 6) return;
            gPair.disabled = true;
            hint(t("pairing"));
            const error = await pair("/api/phone/pair", JSON.stringify({ credential: digits, name: phoneName(), requestId: randomId() }));
            gPair.disabled = false;
            if (!error) {
              $("g-ask").hidden = true;
              $("g-done").hidden = false;
              return finish();
            }
            gCode.value = "";
            read();
            hint(t(error), "error");
            gCode.focus();
          });
          hint(GLASS.hint);
          gCode.focus();
        }

        if (googleToken) {
          void runGoogle(googleToken);
        } else if (qrToken) {
          void run(qrToken);
        } else if (goGoogle) {
          void googleReady(true).then((ready) => (ready ? startGoogle() : glasses ? showGlass() : showForm(false)));
        } else if (glasses) {
          showGlass();
        } else {
          showForm();
        }
      })();
    </script>
  </body>
</html>
