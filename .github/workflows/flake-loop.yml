# Scratch loop for CI-FLAKES-5; lives only on loop/* branches.
name: Flake loop

on:
  push:
    branches: ["loop/**"]

permissions:
  contents: read

jobs:
  loop:
    name: ${{ matrix.flake }} on ${{ matrix.side }}
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { flake: "room-lane CLIs linger 3 s", side: base, ref: 2b7da9fc6bde4784f34c73ce203332e6872e813a, prep: "room-lane-linger.mjs", cmd: "node node_modules/vitest/vitest.mjs run server/room-lane.e2e.test.ts", rounds: 20 }
          - { flake: "room-lane CLIs linger 3 s", side: head, ref: b122b42ecbb619b20ef096b003337b44120f0e4f, prep: "room-lane-linger.mjs", cmd: "node node_modules/vitest/vitest.mjs run server/room-lane.e2e.test.ts", rounds: 20 }
          - { flake: "version probe 9 s", side: base, ref: 2b7da9fc6bde4784f34c73ce203332e6872e813a, prep: "msp-slow-version-base.mjs", cmd: "node node_modules/vitest/vitest.mjs run server/drivers/msp/runtime.test.ts -t \"too slow to tell its version\"", rounds: 20 }
          - { flake: "version probe 9 s", side: head, ref: b122b42ecbb619b20ef096b003337b44120f0e4f, prep: "", cmd: "node node_modules/vitest/vitest.mjs run server/drivers/msp/runtime.test.ts -t \"too slow to tell its version\"", rounds: 20 }
          - { flake: "claude.test.ts", side: base, ref: 2b7da9fc6bde4784f34c73ce203332e6872e813a, prep: "", cmd: "node node_modules/vitest/vitest.mjs run server/drivers/claude.test.ts", rounds: 6 }
          - { flake: "claude.test.ts", side: head, ref: b122b42ecbb619b20ef096b003337b44120f0e4f, prep: "", cmd: "node node_modules/vitest/vitest.mjs run server/drivers/claude.test.ts", rounds: 6 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .loopkit
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Loop
        shell: bash
        env:
          FLAKE: ${{ matrix.flake }}
          SIDE: ${{ matrix.side }}
          PREP: ${{ matrix.prep }}
          CMD: ${{ matrix.cmd }}
          ROUNDS: ${{ matrix.rounds }}
          NO_COLOR: "1"
          FORCE_COLOR: "0"
        run: |
          set -u +e +o pipefail
          git rev-parse HEAD
          if [ -n "$PREP" ]; then node ".loopkit/loopkit/$PREP" && git diff --stat; fi
          fails=0; first=""
          for r in $(seq 1 "$ROUNDS"); do
            if eval "$CMD" > "out-$r.txt" 2>&1; then f=0; else f=1; fi
            sed 's/\x1b\[[0-9;]*m//g' "out-$r.txt" | grep -aqE "Test Files +1 passed" || f=1
            fails=$((fails + f)); echo "round $r: failed $f"; sed 's/\x1b\[[0-9;]*m//g' "out-$r.txt" | grep -aE "Tests |Duration|EPERM"
            if [ "$f" -gt 0 ] && [ -z "$first" ]; then first="out-$r.txt"; fi
          done
          if [ -n "$first" ]; then echo "--- first failing round ($first) ---"; grep -aE "×|FAIL|Error|EPERM|expected|\"ok\"|Tests " "$first" | head -60; fi
          echo "RESULT $FLAKE $SIDE fails=$fails/$ROUNDS"
          echo "RESULT $FLAKE $SIDE fails=$fails/$ROUNDS" >> "$GITHUB_STEP_SUMMARY"
