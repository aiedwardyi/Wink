# Scratch loop for CI-FLAKES-5; lives only on loop/* branches.
name: Flake loop

on:
  push:
    branches: ["loop/**"]

permissions:
  contents: read

jobs:
  loop:
    name: ${{ matrix.flake }} on ${{ matrix.side }}
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { flake: "open reader during replace", side: base, ref: 2635760b4d4781a48c85cd66fb8c3c1d10c5bec9, pattern: "a host record is replaced while a reader still has the old one open", prep: "record-test-base.mjs" }
          - { flake: "open reader during replace", side: head, ref: 2b7da9fc6bde4784f34c73ce203332e6872e813a, pattern: "a host record is replaced while a reader still has the old one open", prep: "" }
          - { flake: "refused replace keeps the record", side: base, ref: 739e5e5945557ab129c2d7931803d8a1a9d77cb4, pattern: "a host record the system will not replace keeps the old one", prep: "record-keep-test.mjs" }
          - { flake: "refused replace keeps the record", side: head, ref: 2b7da9fc6bde4784f34c73ce203332e6872e813a, pattern: "a host record the system will not replace keeps the old one", prep: "" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .loopkit
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Loop
        shell: bash
        env:
          FLAKE: ${{ matrix.flake }}
          SIDE: ${{ matrix.side }}
          PATTERN: ${{ matrix.pattern }}
          PREP: ${{ matrix.prep }}
        run: |
          set -u +e +o pipefail
          git rev-parse HEAD
          if [ -n "$PREP" ]; then node ".loopkit/loopkit/$PREP" && git diff --stat; fi
          fails=0; first=""
          for r in $(seq 1 20); do
            if node --test --test-name-pattern="$PATTERN" electron/worker-host.node-test.mjs > "out-$r.txt" 2>&1; then f=0; else f=1; fi
            grep -aqE "^ℹ pass 1" "out-$r.txt" || f=1
            fails=$((fails + f)); echo "round $r: failed $f"
            if [ "$f" -gt 0 ] && [ -z "$first" ]; then first="out-$r.txt"; fi
          done
          if [ -n "$first" ]; then echo "--- first failing round ($first) ---"; grep -aE "✖|Error|expected|actual|EPERM|EBUSY" "$first" | head -30; fi
          echo "RESULT $FLAKE $SIDE fails=$fails/20"
          echo "RESULT $FLAKE $SIDE fails=$fails/20" >> "$GITHUB_STEP_SUMMARY"
  hunt:
    name: hang hunt, shard 2/2, fix #${{ matrix.n }}
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      npm_config_node_gyp: ${{ github.workspace }}\node_modules\node-gyp\bin\node-gyp.js
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 2b7da9fc6bde4784f34c73ce203332e6872e813a
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Hunt
        shell: bash
        run: |
          set -u +e +o pipefail
          git rev-parse HEAD
          hung=0
          for r in 1 2 3 4; do
            s=$(date +%s)
            NODE_TEST_STALL_MS=90000 NODE_OPTIONS="--test-shard=2/2 --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./scripts/node-test-stalls.mjs --test-reporter-destination=stderr" timeout 420 pnpm test:terminal > "out-$r.txt" 2>&1
            code=$?
            [ "$code" = 124 ] && hung=$((hung + 1))
            echo "round $r: exit $code secs $(( $(date +%s) - s ))"
            grep -a "still running" "out-$r.txt" | sort -u | head -20
            grep -aE "^✖ |test timed out|crashed|0xC0000005|3221225477" "out-$r.txt" | sort -u | head -20
            taskkill //F //IM node.exe > /dev/null 2>&1
          done
          echo "RESULT hunt hung=$hung/4"
          echo "RESULT hunt hung=$hung/4" >> "$GITHUB_STEP_SUMMARY"
