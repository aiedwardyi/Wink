# Scratch loop for CI-FLAKES-4 red/green counts; lives only on loop/* branches.
name: Flake loop

on:
  push:
    branches: ["loop/**"]

permissions:
  contents: read

jobs:
  loop:
    name: ${{ matrix.flake }} on ${{ matrix.side }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { flake: "reply-activity 200k", side: base, ref: e6a05222e72aacc6e27a91dc63bd7c80f0776109, os: windows-latest, kind: vitest, file: "server/reply-activity.test.ts", pattern: "reads 200k rows", copies: 4, runs: 20, prep: "" }
          - { flake: "reply-activity 200k", side: head, ref: 917ed30a3636952649ab77a8ffc664f254a1379b, os: windows-latest, kind: vitest, file: "server/reply-activity.test.ts", pattern: "reads 200k rows", copies: 4, runs: 20, prep: "" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Loop
        shell: bash
        env:
          FLAKE: ${{ matrix.flake }}
          SIDE: ${{ matrix.side }}
          KIND: ${{ matrix.kind }}
          FILE: ${{ matrix.file }}
          PATTERN: ${{ matrix.pattern }}
          COPIES: ${{ matrix.copies }}
          RUNS: ${{ matrix.runs }}
          PREP: ${{ matrix.prep }}
        run: |
          set -u
          if [ -n "$PREP" ]; then bash -c "$PREP"; fi
          git rev-parse HEAD
          fails=0; total=0; first=""
          files=("$FILE")
          if [ "$COPIES" -gt 1 ]; then
            files=()
            for k in $(seq 1 "$COPIES"); do c="${FILE%.test.*}.copy$k.test.${FILE##*.test.}"; cp "$FILE" "$c"; files+=("$c"); done
          fi
          rounds=$((RUNS / COPIES))
          for r in $(seq 1 "$rounds"); do
            if [ "$KIND" = vitest ]; then
              node node_modules/vitest/vitest.mjs run "${files[@]}" -t "$PATTERN" --reporter=default --reporter=json --outputFile.json=loop.json > "out-$r.txt" 2>&1
              read -r f p < <(node -e 'const r=require("./loop.json");console.log(r.numFailedTests,r.numPassedTests)')
            else
              if node --test --test-name-pattern="$PATTERN" "$FILE" > "out-$r.txt" 2>&1; then f=0; p=1; else f=1; p=0; fi
            fi
            fails=$((fails + f)); total=$((total + f + p))
            echo "round $r: failed $f passed $p"
            if [ "$f" -gt 0 ] && [ -z "$first" ]; then first="out-$r.txt"; fi
          done
          if [ -n "$first" ]; then echo "--- first failing round ($first) ---"; grep -aE "FAIL|×|✖|Error|expected|timed out" "$first" | head -40; fi
          echo "RESULT $FLAKE $SIDE fails=$fails/$total"
          echo "RESULT $FLAKE $SIDE fails=$fails/$total" >> "$GITHUB_STEP_SUMMARY"
