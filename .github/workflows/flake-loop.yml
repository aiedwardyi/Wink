# Scratch loop for CI-FLAKES-4 red/green counts; lives only on loop/* branches.
name: Flake loop

on:
  push:
    branches: ["loop/**"]

permissions:
  contents: read

jobs:
  loop:
    name: ${{ matrix.flake }} on ${{ matrix.side }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { flake: "claude native install, cold node", side: base, ref: e6a05222e72aacc6e27a91dc63bd7c80f0776109, os: windows-latest, kind: vitest, file: "server/drivers/claude.test.ts", pattern: "runs the native install when the npm claude ahead of it can't start", copies: 1, runs: 20, prep: "claude-cold-node.mjs" }
          - { flake: "claude native install, cold node", side: head, ref: e3724b78bf80c30a4c664a310dd5e1cc3033251d, os: windows-latest, kind: vitest, file: "server/drivers/claude.test.ts", pattern: "runs the native install when the npm claude ahead of it can't start", copies: 1, runs: 20, prep: "claude-cold-node.mjs" }
          - { flake: "branching rewind, first prompt lands", side: base, ref: e6a05222e72aacc6e27a91dc63bd7c80f0776109, os: ubuntu-latest, kind: vitest, file: "server/branching.test.ts", pattern: "refuses to rewind a live thread", copies: 1, runs: 20, prep: "branching-first-prompt-lands.mjs" }
          - { flake: "branching rewind, first prompt lands", side: head, ref: e3724b78bf80c30a4c664a310dd5e1cc3033251d, os: ubuntu-latest, kind: vitest, file: "server/branching.test.ts", pattern: "refuses to rewind a live thread", copies: 1, runs: 20, prep: "branching-first-prompt-lands.mjs" }
          - { flake: "worker runtime, slow lock release", side: base, ref: e6a05222e72aacc6e27a91dc63bd7c80f0776109, os: windows-latest, kind: node, file: "electron/worker-host-runtime.node-test.mjs", pattern: "a host started from the copied runtime", copies: 1, runs: 20, prep: "worker-runtime-slow-lock.mjs" }
          - { flake: "worker runtime, slow lock release", side: head, ref: e3724b78bf80c30a4c664a310dd5e1cc3033251d, os: windows-latest, kind: node, file: "electron/worker-host-runtime.node-test.mjs", pattern: "a host started from the copied runtime", copies: 1, runs: 20, prep: "worker-runtime-slow-lock.mjs" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .loopkit
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Loop
        shell: bash
        env:
          FLAKE: ${{ matrix.flake }}
          SIDE: ${{ matrix.side }}
          KIND: ${{ matrix.kind }}
          FILE: ${{ matrix.file }}
          PATTERN: ${{ matrix.pattern }}
          COPIES: ${{ matrix.copies }}
          RUNS: ${{ matrix.runs }}
          PREP: ${{ matrix.prep }}
        run: |
          set -u +e +o pipefail
          git rev-parse HEAD
          if [ -n "$PREP" ]; then node ".loopkit/loopkit/$PREP" && git diff --stat; fi
          fails=0; total=0; first=""
          files=("$FILE")
          if [ "$COPIES" -gt 1 ]; then
            files=()
            for k in $(seq 1 "$COPIES"); do c="${FILE%.test.*}.copy$k.test.${FILE##*.test.}"; cp "$FILE" "$c"; files+=("$c"); done
          fi
          rounds=$((RUNS / COPIES))
          for r in $(seq 1 "$rounds"); do
            if [ "$KIND" = vitest ]; then
              node node_modules/vitest/vitest.mjs run "${files[@]}" -t "$PATTERN" --reporter=default --reporter=json --outputFile.json=loop.json > "out-$r.txt" 2>&1
              read -r f p d < <(node -e 'const r=require("./loop.json");const a=r.testResults.flatMap(t=>t.assertionResults).filter(a=>a.status!=="skipped"&&a.status!=="pending");console.log(r.numFailedTests,r.numPassedTests,a.map(a=>Math.round(a.duration??0)).join(","))')
            else
              s=$(date +%s%3N)
              if node --test --test-name-pattern="$PATTERN" "$FILE" > "out-$r.txt" 2>&1; then f=0; p=1; else f=1; p=0; fi
              d=$(( $(date +%s%3N) - s ))
            fi
            fails=$((fails + f)); total=$((total + f + p))
            echo "round $r: failed $f passed $p ms $d"
            if [ "$f" -gt 0 ] && [ -z "$first" ]; then first="out-$r.txt"; fi
          done
          if [ -n "$first" ]; then echo "--- first failing round ($first) ---"; grep -aE "FAIL|×|✖|Error|expected|timed out|not ok" "$first" | head -40; fi
          echo "RESULT $FLAKE $SIDE fails=$fails/$total"
          echo "RESULT $FLAKE $SIDE fails=$fails/$total" >> "$GITHUB_STEP_SUMMARY"
