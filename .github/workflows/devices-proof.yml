name: Devices setup proof

on:
  pull_request:
    branches: [review-base]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devices-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feat/devices-setup'
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      WINK_DEVICE_PROOF_ROOT: ${{ runner.temp }}/wink-SAFE-B
      WINK_PLAYWRIGHT: ${{ runner.temp }}/wink-SAFE-B/playwright/node_modules/playwright
      PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/wink-SAFE-B/browsers
      OUT: ${{ runner.temp }}/wink-SAFE-B/evidence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare the isolated browser
        run: |
          npm install --prefix "$env:WINK_DEVICE_PROOF_ROOT/playwright" playwright@1.63.0 --no-audit --no-fund
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node "$env:WINK_PLAYWRIGHT/cli.js" install --only-shell chromium
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build Today and New
        run: node scripts/devices-setup-proof-build.mjs
      - name: Capture and measure all states
        run: |
          node scripts/devices-setup-proof.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item "$env:WINK_DEVICE_PROOF_ROOT/build-meta.json" "$env:OUT/build-meta.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: devices-setup-proof
          path: ${{ runner.temp }}/wink-SAFE-B/evidence
          if-no-files-found: error
          retention-days: 7
