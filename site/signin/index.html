<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />
    <meta name="theme-color" content="#f7f5fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121316" media="(prefers-color-scheme: dark)" />
    <meta name="referrer" content="strict-origin" />
    <!-- GIS injects button styles; inline scripts stay blocked. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' https://*.wink.edwardyi.dev; connect-src https://relay.wink.edwardyi.dev https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'"
    />
    <title>Wink</title>
    <link rel="stylesheet" href="/signin/signin.css" />
  </head>
  <body>
    <main>
      <div class="panel">
        <img class="logo" src="/app-icon.svg" alt="Wink" width="48" height="48" />
        <h1>Sign in</h1>
        <p class="quiet">Reach Wink on your PC from this phone.</p>
        <p id="status" class="status" role="status" aria-live="polite"></p>
        <div id="list" class="list" hidden></div>
        <div id="google"></div>
        <div class="links">
          <a id="pick" class="privacy" href="/?pick=1">Choose another PC</a>
          <a class="privacy" href="/privacy">Privacy</a>
        </div>
      </div>
    </main>
    <script async src="https://accounts.google.com/gsi/client"></script>
    <script src="/signin/config.js"></script>
    <script src="/signin/signin.js"></script>
  </body>
</html>
